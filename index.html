<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .chart-container { width: 80%; max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>Indoor Air Quality (eCO2 & TVOC)</h1>
    
    <div class="chart-container">
        <canvas id="airQualityChart"></canvas>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtjeTLHgn9_Hq8inNTLv74dNb8mjWLXT4",
            authDomain: "liquid-tree.firebaseapp.com",
            projectId: "liquid-tree",
            databaseURL: "https://liquid-tree-default-rtdb.asia-southeast1.firebasedatabase.app/",
            storageBucket: "liquid-tree.firebasestorage.app",
            messagingSenderId: "64119648120",
            appId: "1:64119648120:web:75c8784c14e996019ba28d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ctx = document.getElementById('airQualityChart').getContext('2d');
        const airChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [
                    {
                        label: 'eCO2 (ppm)',
                        borderColor: 'rgb(255, 99, 132)',
                        backgroundColor: 'rgba(255, 99, 132, 0.1)',
                        data: [],
                        yAxisID: 'y'
                    },
                    {
                        label: 'TVOC (ppb)',
                        borderColor: 'rgb(54, 162, 235)',
                        backgroundColor: 'rgba(54, 162, 235, 0.1)',
                        data: [],
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Time' } },
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'eCO2 (ppm)' } },
                    y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: 'TVOC (ppb)' }, grid: { drawOnChartArea: false } }
                }
            }
        });

        // CHANGED: Path updated to 'env_monitor' to match your ESP32 code
        const sensorRef = ref(db, 'env_monitor'); 
        
        onValue(sensorRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const labels = [];
                const eco2Data = [];
                const tvocData = [];

                // Sort keys so the graph moves chronologically
                const sortedTimestamps = Object.keys(data).sort();

                sortedTimestamps.forEach(timestamp => {
                    const date = new Date(timestamp * 1000);
                    labels.push(date.toLocaleTimeString());
                    
                    // CHANGED: Keys updated to lowercase 'eco2' and 'tvoc' to match ESP32
                    eco2Data.push(data[timestamp].eco2);
                    tvocData.push(data[timestamp].tvoc);
                });

                airChart.data.labels = labels;
                airChart.data.datasets[0].data = eco2Data;
                airChart.data.datasets[1].data = tvocData;
                airChart.update();
            }
        });
    </script>
</body>
</html>
