<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; }
        
        /* Grid for eCO2 and TVOC rows */
        .metrics-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .current-val { font-size: 3rem; font-weight: 800; margin: 10px 0; }
        
        /* Comparison Row Styling */
        .comparison-row { display: flex; justify-content: space-around; border-top: 1px solid #eee; pt: 15px; margin-top: 15px; }
        .comp-item { flex: 1; font-size: 0.95rem; padding: 5px; }
        .label { display: block; font-size: 0.8rem; color: #777; margin-bottom: 3px; }
        
        .improvement { color: #27ae60; font-weight: bold; }
        .decline { color: #e74c3c; font-weight: bold; }
        
        .chart-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AIR QUALITY INTELLIGENCE</h1>

        <div class="metrics-container">
            <!-- eCO2 Card -->
            <div class="card">
                <h3 style="color: #ff6384;">eCO2 (ppm)</h3>
                <div id="eco2-now" class="current-val">--</div>
                <div class="comparison-row">
                    <div class="comp-item">
                        <span class="label">vs. 1 Hour Ago</span>
                        <div id="eco2-1h">--</div>
                    </div>
                    <div class="comp-item" style="border-left: 1px solid #eee;">
                        <span class="label">vs. 24 Hours Ago</span>
                        <div id="eco2-24h">--</div>
                    </div>
                </div>
            </div>

            <!-- TVOC Card -->
            <div class="card">
                <h3 style="color: #36a2eb;">TVOC (ppb)</h3>
                <div id="tvoc-now" class="current-val">--</div>
                <div class="comparison-row">
                    <div class="comp-item">
                        <span class="label">vs. 1 Hour Ago</span>
                        <div id="tvoc-1h">--</div>
                    </div>
                    <div class="comp-item" style="border-left: 1px solid #eee;">
                        <span class="label">vs. 24 Hours Ago</span>
                        <div id="tvoc-24h">--</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="airChart"></canvas>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtjeTLHgn9_Hq8inNTLv74dNb8mjWLXT4",
            authDomain: "liquid-tree.firebaseapp.com",
            projectId: "liquid-tree",
            databaseURL: "https://liquid-tree-default-rtdb.asia-southeast1.firebasedatabase.app/",
            storageBucket: "liquid-tree.firebasestorage.app",
            messagingSenderId: "64119648120",
            appId: "1:64119648120:web:75c8784c14e996019ba28d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Chart Setup
        const ctx = document.getElementById('airChart').getContext('2d');
        const airChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'eCO2', borderColor: '#ff6384', backgroundColor: 'rgba(255,99,132,0.1)', fill: true, data: [], yAxisID: 'y', tension: 0.4 },
                { label: 'TVOC', borderColor: '#36a2eb', backgroundColor: 'rgba(54,162,235,0.1)', fill: true, data: [], yAxisID: 'y1', tension: 0.4 }
            ]},
            options: { responsive: true, scales: { 
                y: { position: 'left', title: { display: true, text: 'ppm' } },
                y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'ppb' } }
            }}
        });

        const sensorRef = ref(db, 'env_monitor');

        onValue(sensorRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const tsKeys = Object.keys(data).sort();
            const latestTs = parseInt(tsKeys[tsKeys.length - 1]);
            
            // Current Values
            const curEco2 = data[latestTs].eco2;
            const curTvoc = data[latestTs].tvoc;

            document.getElementById('eco2-now').innerText = curEco2;
            document.getElementById('tvoc-now').innerText = curTvoc;

            // Find Historical Data (1h = 3600s, 24h = 86400s)
            const historical = {
                eco2_1h: findNearest(data, tsKeys, latestTs - 3600),
                eco2_24h: findNearest(data, tsKeys, latestTs - 86400),
                tvoc_1h: findNearest(data, tsKeys, latestTs - 3600, 'tvoc'),
                tvoc_24h: findNearest(data, tsKeys, latestTs - 86400, 'tvoc')
            };

            // Update UI Comparisons
            updateUI('eco2-1h', curEco2, historical.eco2_1h);
            updateUI('eco2-24h', curEco2, historical.eco2_24h);
            updateUI('tvoc-1h', curTvoc, historical.tvoc_1h);
            updateUI('tvoc-24h', curTvoc, historical.tvoc_24h);

            // Graph update (last 50 points)
            const labels = [], d1 = [], d2 = [];
            tsKeys.slice(-50).forEach(k => {
                labels.push(new Date(k * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
                d1.push(data[k].eco2);
                d2.push(data[k].tvoc);
            });
            airChart.data.labels = labels;
            airChart.data.datasets[0].data = d1;
            airChart.data.datasets[1].data = d2;
            airChart.update();
        });

        function findNearest(data, keys, target, type = 'eco2') {
            for (let i = keys.length - 1; i >= 0; i--) {
                if (parseInt(keys[i]) <= target) return data[keys[i]][type];
            }
            return null;
        }

        function updateUI(id, current, past) {
            const el = document.getElementById(id);
            if (past === null) { el.innerText = "---"; return; }
            
            const diff = ((current - past) / past) * 100;
            const absDiff = Math.abs(diff).toFixed(1);
            
            if (diff <= 0) {
                el.innerHTML = `<span class="improvement">↓ ${absDiff}%</span>`;
            } else {
                el.innerHTML = `<span class="decline">↑ ${absDiff}%</span>`;
            }
        }
    </script>
</body>
</html>
