<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pohon cair</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; padding: 10px; color: #333; margin: 0; }
        .container { max-width: 1100px; margin: auto; padding: 10px; }
        
        .header { margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; }
        #live-date { font-size: 0.9rem; color: #666; margin-top: 5px; font-weight: 500; }
        .update-badge { background: #e8f0fe; color: #1a73e8; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; margin-top: 8px; border: 1px solid #d2e3fc; }

        .section-title { font-size: 1.2rem; font-weight: 700; margin: 30px 0 15px 0; color: #2c3e50; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: #ddd; }

        .metrics-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .current-val { font-size: 2.5rem; font-weight: 800; margin: 5px 0; }
        
        .comparison-row { display: flex; justify-content: space-around; border-top: 1px solid #f1f1f1; padding-top: 15px; margin-top: 15px; }
        .comp-item { flex: 1; font-size: 0.85rem; }
        .label { display: block; font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.8px; }
        
        .improvement { color: #2ecc71; font-weight: bold; }
        .decline { color: #e74c3c; font-weight: bold; }
        
        /* Algae Impact Styling */
        .impact-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .impact-card { background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border: 1px solid #a5d6a7; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .impact-card.tvoc { background: linear-gradient(135deg, #e3f2fd, #bbdefb); border: 1px solid #90caf9; }
        .impact-headline { font-size: 1.5rem; font-weight: 800; color: #1b5e20; margin: 10px 0; }
        .impact-card.tvoc .impact-headline { color: #0d47a1; }
        .impact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid rgba(0,0,0,0.08); padding-top: 10px; margin-top: 5px; font-size: 0.85rem; }

        /* Controls Panel */
        .controls-panel { background: white; padding: 15px 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 20px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 150px; }
        .control-group label { font-size: 0.75rem; font-weight: bold; color: #666; text-transform: uppercase; }
        .control-group select, .control-group input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; font-size: 0.9rem; outline: none; }
        .control-group select:focus, .control-group input:focus { border-color: #1a73e8; }

        /* Graph Layout */
        .charts-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 25px; }
        .chart-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); height: 320px; position: relative; }

        @media (min-width: 900px) {
            .charts-grid { grid-template-columns: 1fr 1fr; }
            .full-width-chart { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 style="margin: 0; letter-spacing: -0.5px;">monitor kualitas udara pohon cair</h1>
            <div id="live-date">Syncing...</div>
            <div id="last-sync" class="update-badge">Last Update: --</div>
        </div>

        <div class="section-title">Live Diagnostics</div>
        <div class="metrics-container">
            <div class="card">
                <h3 style="color: #ff6384; margin: 0; font-size: 1rem;">eCO2 (ppm)</h3>
                <div id="eco2-now" class="current-val">--</div>
                <div class="comparison-row">
                    <div class="comp-item"><span class="label">1H Change</span><div id="eco2-1h">--</div></div>
                    <div class="comp-item" style="border-left:1px solid #eee"><span class="label">24H Change</span><div id="eco2-24h">--</div></div>
