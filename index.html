<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pohon cair</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; padding: 10px; color: #333; margin: 0; }
        .container { max-width: 1100px; margin: auto; padding: 10px; }
        
        .header { margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; }
        #live-date { font-size: 0.9rem; color: #666; margin-top: 5px; font-weight: 500; }
        .update-badge { background: #e8f0fe; color: #1a73e8; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; margin-top: 8px; border: 1px solid #d2e3fc; }

        .metrics-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        .current-val { font-size: 2.5rem; font-weight: 800; margin: 5px 0; }
        
        .comparison-row { display: flex; justify-content: space-around; border-top: 1px solid #f1f1f1; padding-top: 15px; margin-top: 15px; }
        .comp-item { flex: 1; font-size: 0.85rem; }
        .label { display: block; font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.8px; }
        
        .improvement { color: #2ecc71; font-weight: bold; }
        .decline { color: #e74c3c; font-weight: bold; }
        
        /* Graph Layout */
        .charts-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .chart-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); height: 320px; position: relative; }

        @media (min-width: 900px) {
            .charts-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 style="margin: 0; letter-spacing: -0.5px;">monitor kualitas udara pohon cair</h1>
            <div id="live-date">Syncing...</div>
            <div id="last-sync" class="update-badge">Last Update: --</div>
        </div>

        <div class="metrics-container">
            <div class="card">
                <h3 style="color: #ff6384; margin: 0; font-size: 1rem;">eCO2 (ppm)</h3>
                <div id="eco2-now" class="current-val">--</div>
                <div class="comparison-row">
                    <div class="comp-item"><span class="label">1H Change</span><div id="eco2-1h">--</div></div>
                    <div class="comp-item" style="border-left:1px solid #eee"><span class="label">24H Change</span><div id="eco2-24h">--</div></div>
                </div>
            </div>

            <div class="card">
                <h3 style="color: #36a2eb; margin: 0; font-size: 1rem;">TVOC (ppb)</h3>
                <div id="tvoc-now" class="current-val">--</div>
                <div class="comparison-row">
                    <div class="comp-item"><span class="label">1H Change</span><div id="tvoc-1h">--</div></div>
                    <div class="comp-item" style="border-left:1px solid #eee"><span class="label">24H Change</span><div id="tvoc-24h">--</div></div>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-box">
                <canvas id="gasChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="thChart"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtjeTLHgn9_Hq8inNTLv74dNb8mjWLXT4",
            authDomain: "liquid-tree.firebaseapp.com",
            projectId: "liquid-tree",
            databaseURL: "https://liquid-tree-default-rtdb.asia-southeast1.firebasedatabase.app/",
            storageBucket: "liquid-tree.firebasestorage.app",
            messagingSenderId: "64119648120",
            appId: "1:64119648120:web:75c8784c14e996019ba28d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Chart 1: Gas Levels (eCO2 & TVOC)
        const gasChart = new Chart(document.getElementById('gasChart').getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'eCO2', borderColor: '#ff6384', backgroundColor: 'rgba(255,99,132,0.05)', fill: true, data: [], yAxisID: 'y', tension: 0.4, pointRadius: 0 },
                { label: 'TVOC', borderColor: '#36a2eb', backgroundColor: 'rgba(54,162,235,0.05)', fill: true, data: [], yAxisID: 'y1', tension: 0.4, pointRadius: 0 }
            ]},
            options: { maintainAspectRatio: false, plugins: { title: { display: true, text: 'Gas Concentration Trends' } }, scales: { 
                y: { position: 'left', title: { display: true, text: 'ppm' } },
                y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'ppb' } }
            }}
        });

        // Chart 2: Environment (Temp & Humidity)
        const thChart = new Chart(document.getElementById('thChart').getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'Temp (°C)', borderColor: '#ff9f40', data: [], tension: 0.4, pointRadius: 0 },
                { label: 'Hum (%)', borderColor: '#4bc0c0', data: [], tension: 0.4, pointRadius: 0 }
            ]},
            options: { maintainAspectRatio: false, plugins: { title: { display: true, text: 'Temperature & Humidity' } }, scales: { 
                y: { title: { display: true, text: 'Value' } }
            }}
        });

        // Robust Timestamp Parser (Handles Unix format and alphanumeric Push IDs)
        function getTimestampMs(key, record) {
            if (/^\d+$/.test(key)) {
                const num = parseInt(key);
                return num > 9999999999 ? num : num * 1000;
            }
            if (record) {
                const inlineFields = ['timestamp', 'time', 'epoch', 'ts'];
                for (let f of inlineFields) {
                    if (record[f] !== undefined && record[f] !== null) {
                        const num = parseInt(record[f]);
                        if (!isNaN(num)) return num > 9999999999 ? num : num * 1000;
                    }
                }
            }
            if (key && key.startsWith('-') && key.length >= 8) {
                try {
                    const PUSH_CHARS = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';
                    let time = 0;
                    for (let i = 0; i < 8; i++) {
                        time = time * 64 + PUSH_CHARS.indexOf(key.charAt(i));
                    }
                    return time;
                } catch (e) {}
            }
            return Date.now();
        }

        const sensorRef = ref(db, 'env_monitor');

        onValue(sensorRef, (snapshot) => {
            try {
                const data = snapshot.val();
                if (!data) {
                    console.warn("Database snapshot is empty at 'env_monitor'");
                    return;
                }

                const tsKeys = Object.keys(data).sort();
                if (tsKeys.length === 0) return;

                const latestKey = tsKeys[tsKeys.length - 1];
                const latestRecord = data[latestKey];
                if (!latestRecord) return;
                
                // Safe Timestamp Extraction
                const latestTsMs = getTimestampMs(latestKey, latestRecord);
                const now = new Date(latestTsMs);
                
                // Header Info
                document.getElementById('live-date').innerText = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
                document.getElementById('last-sync').innerText = "Last Update: " + now.toLocaleTimeString();

                // Current Values with Fallbacks
                document.getElementById('eco2-now').innerText = latestRecord.eco2 !== undefined ? latestRecord.eco2 : '--';
                document.getElementById('tvoc-now').innerText = latestRecord.tvoc !== undefined ? latestRecord.tvoc : '--';

                // Real-time Delta Calculations
                updateUI('eco2-1h', latestRecord.eco2, findNearest(data, tsKeys, latestTsMs - 3600000, 'eco2'));
                updateUI('eco2-24h', latestRecord.eco2, findNearest(data, tsKeys, latestTsMs - 86400000, 'eco2'));
                updateUI('tvoc-1h', latestRecord.tvoc, findNearest(data, tsKeys, latestTsMs - 3600000, 'tvoc'));
                updateUI('tvoc-24h', latestRecord.tvoc, findNearest(data, tsKeys, latestTsMs - 86400000, 'tvoc'));

                // Graph Updates (Last 40 readings)
                const labels = [], g_eco2 = [], g_tvoc = [], g_temp = [], g_hum = [];
                tsKeys.slice(-40).forEach(k => {
                    const item = data[k];
                    const itemTsMs = getTimestampMs(k, item);
                    
                    labels.push(new Date(itemTsMs).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
                    g_eco2.push(item.eco2 !== undefined ? item.eco2 : null);
                    g_tvoc.push(item.tvoc !== undefined ? item.tvoc : null);
                    g_temp.push(item.temp !== undefined ? item.temp : null);
                    g_hum.push(item.hum !== undefined ? item.hum : null);
                });

                // Update Gas Chart
                gasChart.data.labels = labels;
                gasChart.data.datasets[0].data = g_eco2;
                gasChart.data.datasets[1].data = g_tvoc;
                gasChart.update();

                // Update Temp/Hum Chart
                thChart.data.labels = labels;
                thChart.data.datasets[0].data = g_temp;
                thChart.data.datasets[1].data = g_hum;
                thChart.update();

            } catch (err) {
                console.error("Error parsing real-time dashboard data: ", err);
            }
        });

        function findNearest(data, keys, targetTsMs, type) {
            for (let i = keys.length - 1; i >= 0; i--) {
                const k = keys[i];
                const currentTsMs = getTimestampMs(k, data[k]);
                if (currentTsMs <= targetTsMs) {
                    if (data[k] && data[k][type] !== undefined) return data[k][type];
                }
            }
            return null;
        }

        function updateUI(id, current, past) {
            const el = document.getElementById(id);
            if (!el) return;
            if (past === null || current === undefined || current === null) { el.innerText = "---"; return; }
            const diff = ((current - past) / past) * 100;
            const absDiff = Math.abs(diff).toFixed(1);
            el.innerHTML = diff <= 0 ? `<span class="improvement">↓ ${absDiff}%</span>` : `<span class="decline">↑ ${absDiff}%</span>`;
        }
    </script>
</body>
</html>
