<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Dashboard</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .chart-container { width: 80%; max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>Indoor Air Quality (eCO2 & TVOC)</h1>
    
    <div class="chart-container">
        <canvas id="airQualityChart"></canvas>
    </div>

    <!-- Firebase SDK (Modular v9 via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        // TODO: Replace with your Firebase config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Initialize Chart.js
        const ctx = document.getElementById('airQualityChart').getContext('2d');
        const airChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Timestamps will go here
                datasets: [
                    {
                        label: 'eCO2 (ppm)',
                        borderColor: 'rgb(255, 99, 132)',
                        data: [],
                        yAxisID: 'y'
                    },
                    {
                        label: 'TVOC (ppb)',
                        borderColor: 'rgb(54, 162, 235)',
                        data: [],
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Time' } },
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'eCO2' } },
                    y1: { type: 'linear', display: true, position: 'right', title: { display: true, text: 'TVOC' }, grid: { drawOnChartArea: false } }
                }
            }
        });

        // Fetch Data from Firebase Realtime Database
        const sensorRef = ref(db, 'sensor_readings');
        onValue(sensorRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const labels = [];
                const eco2Data = [];
                const tvocData = [];

                // Loop through timestamps
                Object.keys(data).forEach(timestamp => {
                    // Convert Unix timestamp to readable time string
                    const date = new Date(timestamp * 1000);
                    labels.push(date.toLocaleTimeString());
                    
                    eco2Data.push(data[timestamp].eCO2);
                    tvocData.push(data[timestamp].TVOC);
                });

                // Update Chart
                airChart.data.labels = labels;
                airChart.data.datasets[0].data = eco2Data;
                airChart.data.datasets[1].data = tvocData;
                airChart.update();
            }
        });
    </script>
</body>
</html>
