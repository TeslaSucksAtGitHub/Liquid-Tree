<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAtjeTLHgn9_Hq8inNTLv74dNb8mjWLXT4",
        authDomain: "liquid-tree.firebaseapp.com",
        projectId: "liquid-tree",
        databaseURL: "https://liquid-tree-default-rtdb.asia-southeast1.firebasedatabase.app/",
        storageBucket: "liquid-tree.firebasestorage.app",
        messagingSenderId: "64119648120",
        appId: "1:64119648120:web:75c8784c14e996019ba28d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- Vertical Line Plugin ---
    const verticalLinePlugin = {
        id: 'verticalLine',
        afterDraw: (chart) => {
            if (chart.tooltip?._active?.length) {
                const x = chart.tooltip._active[0].element.x;
                const yAxis = chart.scales.y;
                const ctx = chart.ctx;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x, yAxis.top);
                ctx.lineTo(x, yAxis.bottom);
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#999'; // Color of the vertical line
                ctx.setLineDash([5, 5]); // Dashed line effect
                ctx.stroke();
                ctx.restore();
            }
        }
    };

    // Shared Chart Options for Hover Effect
    const sharedOptions = {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
            mode: 'index',      // Shows data for all datasets at that X-axis point
            intersect: false,   // Line follows mouse even if not touching a point
        },
        plugins: {
            legend: { position: 'bottom' },
            tooltip: {
                backgroundColor: 'rgba(255, 255, 255, 0.9)',
                titleColor: '#333',
                bodyColor: '#666',
                borderColor: '#ddd',
                borderWidth: 1,
                padding: 10,
                displayColors: true
            }
        }
    };

    // Chart 1: Gas Levels
    const gasChart = new Chart(document.getElementById('gasChart').getContext('2d'), {
        type: 'line',
        plugins: [verticalLinePlugin], // Attach the crosshair plugin
        data: { labels: [], datasets: [
            { label: 'eCO2', borderColor: '#ff6384', backgroundColor: 'rgba(255,99,132,0.05)', fill: true, data: [], yAxisID: 'y', tension: 0.4, pointRadius: 0, pointHoverRadius: 5 },
            { label: 'TVOC', borderColor: '#36a2eb', backgroundColor: 'rgba(54,162,235,0.05)', fill: true, data: [], yAxisID: 'y1', tension: 0.4, pointRadius: 0, pointHoverRadius: 5 }
        ]},
        options: {
            ...sharedOptions,
            scales: { 
                y: { position: 'left', title: { display: true, text: 'ppm' } },
                y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'ppb' } }
            }
        }
    });

    // Chart 2: Environment
    const thChart = new Chart(document.getElementById('thChart').getContext('2d'), {
        type: 'line',
        plugins: [verticalLinePlugin],
        data: { labels: [], datasets: [
            { label: 'Temp (°C)', borderColor: '#ff9f40', data: [], tension: 0.4, pointRadius: 0, pointHoverRadius: 5 },
            { label: 'Hum (%)', borderColor: '#4bc0c0', data: [], tension: 0.4, pointRadius: 0, pointHoverRadius: 5 }
        ]},
        options: {
            ...sharedOptions,
            scales: { y: { title: { display: true, text: 'Value' } } }
        }
    });

    const sensorRef = ref(db, 'env_monitor');

    onValue(sensorRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const tsKeys = Object.keys(data).sort();
        const latestTs = parseInt(tsKeys[tsKeys.length - 1]);
        
        // Headers & Comparisons
        const now = new Date(latestTs * 1000);
        document.getElementById('live-date').innerText = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        document.getElementById('last-sync').innerText = "Last Update: " + now.toLocaleTimeString();

        document.getElementById('eco2-now').innerText = data[latestTs].eco2;
        document.getElementById('tvoc-now').innerText = data[latestTs].tvoc;

        updateUI('eco2-1h', data[latestTs].eco2, findNearest(data, tsKeys, latestTs - 3600, 'eco2'));
        updateUI('eco2-24h', data[latestTs].eco2, findNearest(data, tsKeys, latestTs - 86400, 'eco2'));
        updateUI('tvoc-1h', data[latestTs].tvoc, findNearest(data, tsKeys, latestTs - 3600, 'tvoc'));
        updateUI('tvoc-24h', data[latestTs].tvoc, findNearest(data, tsKeys, latestTs - 86400, 'tvoc'));

        // Prepare Graph Arrays
        const labels = [], g_eco2 = [], g_tvoc = [], g_temp = [], g_hum = [];
        tsKeys.slice(-40).forEach(k => {
            labels.push(new Date(k * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            g_eco2.push(data[k].eco2);
            g_tvoc.push(data[k].tvoc);
            g_temp.push(data[k].temp);
            g_hum.push(data[k].hum);
        });

        // Batch Update
        gasChart.data.labels = labels;
        gasChart.data.datasets[0].data = g_eco2;
        gasChart.data.datasets[1].data = g_tvoc;
        gasChart.update('none'); // Update without animation for smoothness

        thChart.data.labels = labels;
        thChart.data.datasets[0].data = g_temp;
        thChart.data.datasets[1].data = g_hum;
        thChart.update('none');
    });

    function findNearest(data, keys, target, type) {
        for (let i = keys.length - 1; i >= 0; i--) {
            if (parseInt(keys[i]) <= target) return data[keys[i]][type];
        }
        return null;
    }

    function updateUI(id, current, past) {
        const el = document.getElementById(id);
        if (past === null) { el.innerText = "---"; return; }
        const diff = ((current - past) / past) * 100;
        const absDiff = Math.abs(diff).toFixed(1);
        el.innerHTML = diff <= 0 ? `<span class="improvement">↓ ${absDiff}%</span>` : `<span class="decline">↑ ${absDiff}%</span>`;
    }
</script>
